[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-goggles-bridge"
version = "0.1.0"
description = "A documented DJI Goggles 3 and FPV Goggles V2 H.264 and NumPy frame SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
keywords = ["dji", "goggles", "h264", "video", "rndis"]
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.3,<2", "libusb-package>=1.0,<2; sys_platform == 'win32'"]
decode = ["av>=14,<20", "numpy>=1.26,<3"]
apps = ["av>=14,<20", "numpy>=1.26,<3", "opencv-python>=4.10,<6", "pyusb>=1.3,<2", "libusb-package>=1.0,<2; sys_platform == 'win32'", "aiohttp>=3.10,<4", "aiortc>=1.14,<2"]
dev = ["ruff>=0.9,<1", "build>=1,<2"]
exe = ["pyinstaller>=6,<7"]

[project.scripts]
goggles-view = "apps.viewer:main"
goggles-serve = "apps.server:main"
goggles-webrtc = "apps.webrtc:main"
goggles-windows = "apps.windows_app:main"
goggles-mac = "apps.mac_app:main"
goggles-linux = "apps.linux_app:main"

[tool.setuptools]
package-dir = {"" = "src", "scripts" = "scripts"}
py-modules = ["dji_goggles_bridge", "goggles_3", "goggles_v2", "decoder", "rndis", "usb_backend"]
packages = ["apps", "apps.goggles_resources"]

[tool.setuptools.package-data]
"apps.goggles_resources" = ["*.ps1", "*.html"]

[tool.setuptools.cmdclass]
egg_info = "scripts.packaging_commands.EggInfo"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".local", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
